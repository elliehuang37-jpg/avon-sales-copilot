<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雅芳銷售小幫手 AVON Sales Partner Copilot</title>
<meta name="description" content="雅芳銷售小幫手：每天整理該關心的顧客、跟著型錄檔期提醒、建議話術並追蹤結果。資料只存在你的手機。">
<meta name="theme-color" content="#e5004b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="雅芳小幫手">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* 雅芳品牌：Avon Red #E5004B、深紅 #B8003C、Lato＋中文黑體 */
:root{
  --bg:#fbf8f8; --surface:#ffffff; --surface-2:#f6eef0; --line:#eadfe2;
  --text:#1a1418; --muted:#5e5458; --brand:#e5004b; --brand-2:#b8003c; --brand-soft:#fff0f4; --brand-fill:#e5004b; --brand-fill-2:#e5004b; --bar-soft:#f6c3d2;
  --gold:#e5004b; --ok:#1f7a3f; --ok-soft:#e4f3e9; --warn:#a15c00; --warn-soft:#fff1dc;
  --line-green:#06c755; --shadow:0 2px 10px rgba(80,10,30,.07);
  --c-birthday:#e5004b; --c-followup:#a15c00; --c-deadline:#b8003c; --c-refill:#1f7a3f; --c-sample:#0e7c86;
  --c-newbie:#1d6fb8; --c-catalog:#0060ac; --c-noreply:#5e5458; --c-festival:#c2410c; --c-winback:#8a4b08;
  --c-dormant:#6d6466; --c-general:#8a5a6e;
  --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171214; --surface:#221a1d; --surface-2:#2e2428; --line:#3c2f34;
    --text:#f7eef1; --muted:#bdabb2; --brand:#ff5c8a; --brand-2:#ff8aac; --brand-soft:#3a1824; --brand-fill:#c8003f; --brand-fill-2:#c8003f; --bar-soft:#5c2539;
    --gold:#ff8aac; --ok:#5fd394; --ok-soft:#173528; --warn:#f2b555; --warn-soft:#3a2b14; --shadow:0 2px 12px rgba(0,0,0,.35);
    --c-birthday:#c8003f; --c-followup:#9a5a00; --c-deadline:#a3003a; --c-refill:#237a43; --c-sample:#0e7c86;
    --c-newbie:#2b6fb0; --c-catalog:#1f64a8; --c-noreply:#6a5f64; --c-festival:#b8430f; --c-winback:#8a4b08;
    --c-dormant:#6d6466; --c-general:#8a5a6e;
  }
}
:root[data-theme="dark"]{
  --bg:#171214; --surface:#221a1d; --surface-2:#2e2428; --line:#3c2f34;
  --text:#f7eef1; --muted:#bdabb2; --brand:#ff5c8a; --brand-2:#ff8aac; --brand-soft:#3a1824; --brand-fill:#c8003f; --brand-fill-2:#c8003f; --bar-soft:#5c2539;
  --gold:#ff8aac; --ok:#5fd394; --ok-soft:#173528; --warn:#f2b555; --warn-soft:#3a2b14; --shadow:0 2px 12px rgba(0,0,0,.35);
  --c-birthday:#c8003f; --c-followup:#9a5a00; --c-deadline:#a3003a; --c-refill:#237a43; --c-sample:#0e7c86;
  --c-newbie:#2b6fb0; --c-catalog:#1f64a8; --c-noreply:#6a5f64; --c-festival:#b8430f; --c-winback:#8a4b08;
  --c-dormant:#6d6466; --c-general:#8a5a6e;
}
:root.big{--fs:20px}
.camp{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.camp.urgent{border-left-color:var(--warn);background:var(--warn-soft)}
.camp .e{font-size:1.6rem}
.camp .grow{flex:1;min-width:0;font-size:.92rem;line-height:1.5}
.camp{flex-wrap:wrap}
.camp .col{display:flex;gap:8px;width:100%}
.camp .col .btn{flex:1}
.risk{background:var(--warn-soft);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:.88rem}
.risk p{margin:6px 0 0}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Lato","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.55;min-height:100vh;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid transparent}
header.top.scrolled{border-color:var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top-in img{width:36px;height:36px;border-radius:4px}
.top-in .t{flex:1;min-width:0}
.top-in .t b{display:block;font-size:1.05rem;line-height:1.2}
.top-in .t small{color:var(--muted);font-size:.8rem}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.15rem}
.view{display:none;padding-top:6px}
.view.on{display:block}
h2{font-size:1.25rem;margin:18px 0 10px}
h3{font-size:1.02rem;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.hero{background:linear-gradient(135deg,var(--brand-fill),var(--brand-fill-2));color:#fff;border:none;display:flex;gap:16px;align-items:center}
.hero h1{font-size:1.3rem;margin:0 0 4px;line-height:1.3}
.hero p{margin:0;opacity:.92;font-size:.92rem}
.ring{flex:none;width:76px;height:76px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.05rem;color:#fff}
.banner{display:flex;gap:12px;align-items:center;background:var(--warn-soft);border:1px solid transparent;color:var(--text);border-radius:14px;padding:12px 14px;font-size:.9rem}
.banner .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:1rem;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--brand-fill);border-color:var(--brand-fill);color:#fff}
.btn.line{background:var(--line-green);border-color:var(--line-green);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:0 12px;font-size:.88rem;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 0;padding:0 10px}
.btn{white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;text-align:left}
.task+.task{margin-top:10px}
.avatar{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.1rem;color:#fff;background:var(--c-general)}
.task .mid{flex:1;min-width:0}
.task .name{font-weight:700;font-size:1.05rem}
.task .why{color:var(--muted);font-size:.88rem;margin-top:2px}
.task .go{flex:none;background:var(--brand-fill);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:.9rem}
.task.done{opacity:.85;box-shadow:none}
.task.done .go{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:var(--c-general);vertical-align:2px;white-space:nowrap}
.chip.soft{background:var(--surface-2);color:var(--muted)}
.vip{color:var(--gold);font-size:.9rem}
.more-toggle{width:100%;margin-top:10px}
.empty{text-align:center;padding:28px 16px}
.empty .big{font-size:2.6rem}
.search{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem}
.chips button.on{background:var(--brand-fill);border-color:var(--brand-fill);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.6rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.85rem}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .col{width:100%;max-width:38px;border-radius:8px 8px 4px 4px;background:var(--bar-soft);position:relative;overflow:hidden;min-height:3px}
.bar .col i{position:absolute;left:0;right:0;bottom:0;background:var(--brand-fill)}
.bar small{font-size:.72rem;color:var(--muted)}
.bar em{font-style:normal;font-size:.78rem;font-weight:700}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:7.2em 1fr 3.4em;gap:10px;align-items:center;font-size:.88rem}
.hbar+.hbar{margin-top:8px}
.hbar .track{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:6px}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.list-item:last-child{border-bottom:0}
.list-item .mid{flex:1;min-width:0}
.list-item .avatar{width:42px;height:42px;font-size:1rem}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;text-decoration:none;color:var(--text);font-size:1rem}
.menu>*:last-child{border-bottom:0}
.menu .ic{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;flex:none}
.menu .grow{flex:1}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--brand-fill)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:3px solid var(--brand-2);outline-offset:2px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:600;position:relative}
nav.tabs a .e{font-size:1.4rem;line-height:1.1;filter:grayscale(.6);opacity:.8}
nav.tabs a.on{color:var(--brand)}
nav.tabs a.on .e{filter:none;opacity:1}
nav.tabs .badge[hidden]{display:none}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand-fill);color:#fff;font-size:.72rem;display:grid;place-items:center}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(30,10,18,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-card{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
html.demo .sheet-card,html.demo .toast{animation:none;transition:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sheet-head{display:flex;align-items:center;gap:12px;padding:6px 0 4px;position:sticky;top:-8px;background:var(--bg);z-index:1}
.sheet-head h2{margin:0;flex:1;font-size:1.15rem}
.step{display:flex;gap:10px;align-items:center;font-weight:700;margin:18px 0 8px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--brand-fill);color:#fff;display:grid;place-items:center;font-size:.9rem;flex:none}
textarea.msg{width:100%;min-height:150px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:14px;line-height:1.65;resize:vertical}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-size:.9rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-grid button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.result-grid button span{font-size:1.4rem;line-height:1}
.result-grid button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:.88rem;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px}
.field textarea{min-height:80px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600}
.check input{width:24px;height:24px;accent-color:var(--brand)}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}
.timeline .ev{position:relative;padding:6px 0 10px;font-size:.9rem}
.timeline .ev::before{content:"";position:absolute;left:-23px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.timeline .ev.buy::before{background:var(--brand-fill)}
.kv{display:grid;grid-template-columns:5em 1fr;gap:6px 10px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2b1d22;color:#fff;padding:12px 18px;border-radius:14px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:40;width:max-content;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:#ffb3d1;font-weight:700;padding:4px}
.tip{background:var(--brand-soft);border-radius:14px;padding:12px 14px;font-size:.9rem}
.steps-guide{counter-reset:s;list-style:none;padding:0;margin:0}
.steps-guide li{counter-increment:s;display:flex;gap:12px;padding:10px 0}
.steps-guide li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-fill);color:#fff;display:grid;place-items:center;font-weight:700}
.celebrate{text-align:center;padding:22px 12px}
.celebrate .big{font-size:3rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
@media (min-width:900px){
  .wrap{max-width:980px}
  .top-in{max-width:980px}
  .desk{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <img src="icons/logo-64.png" alt="AVON">
    <div class="t"><b>雅芳銷售小幫手</b><small id="todayLabel"></small></div>
    <button class="icon-btn" id="helpBtn" aria-label="怎麼用">❔</button>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-customers"></section>
  <section class="view" id="v-results"></section>
  <section class="view" id="v-more"></section>
</main>

<nav class="tabs" aria-label="主要功能">
  <div class="in">
    <a href="#today" data-tab="today"><span class="e">☀️</span>今天<span class="badge" id="badge" hidden></span></a>
    <a href="#customers" data-tab="customers"><span class="e">👥</span>顧客</a>
    <a href="#results" data-tab="results"><span class="e">📈</span>業績</a>
    <a href="#more" data-tab="more"><span class="e">⚙️</span>更多</a>
  </div>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card" id="sheetCard"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- 小工具 ---------- */
const KEY = 'spca-data-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5); // b − a（天）
const today = () => ymd(new Date());
const md = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const money = n => '$' + Math.round(n || 0).toLocaleString('zh-TW');
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const callName = c => c.nick || (c.name.length >= 3 ? c.name.slice(1) : c.name);

/* ---------- 雅芳品類 ---------- */
// 週期是預設的「大約多久用完」，使用者每筆都可以改
const CATS = [
  { k: 'hair', label: '髮品', emoji: '💆‍♀️', cycle: 45, re: /洗髮|潤髮|護髮|髮|頭皮/ },
  { k: 'intimate', label: '私密潔浴', emoji: '🌸', cycle: 30, re: /私密|潔浴|沐浴|浴/ },
  { k: 'deo', label: '體香／制汗', emoji: '🌿', cycle: 30, re: /體香|止汗|制汗|滾珠|爽身/ },
  { k: 'skin', label: '臉部保養', emoji: '✨', cycle: 60, re: /精華|乳液|乳霜|面霜|化妝水|洗面|洗顏|眼霜|面膜|防曬|保養|卸妝/ },

  const { camp, fest } = ctx(t);
  const P = sortDate(c.purchases), C = sortDate(c.contacts), S = sortDate(c.samples || []);
  const lastP = P[P.length - 1], lastC = C[C.length - 1];
  const sinceC = lastC ? diff(lastC.date, t) : 999;
  const sinceP = lastP ? diff(lastP.date, t) : 999;
  const contactedSince = day => C.some(x => x.date >= day);
  const out = [];

  if (c.followUp && c.followUp <= t)
    out.push({ r: 'followup', s: 95, why: c.followUp === t ? '你約好今天再聯絡' : `約好 ${md(c.followUp)} 再聯絡，已經過了 ${diff(c.followUp, t)} 天` });
  if (c.birthday && /^\d{2}-\d{2}$/.test(c.birthday)) {
    const n = daysToBirthday(c.birthday, t);
    if (n <= 7 && !C.some(x => x.reason === 'birthday' && diff(x.date, t) <= 10))
      out.push({ r: 'birthday', s: n === 0 ? 100 : 88 - n * 2, why: n === 0 ? '今天生日 🎂 送上祝福' : `${n} 天後生日（${c.birthday.replace('-', '/')}），先預約祝福` });
  }
  // 型錄節奏：截止前提醒熟客、上架時分享給近半年有買的顧客
  if (camp && !camp.expired && sinceC >= 2 && sinceP <= 180) {
    const orderedThis = P.some(p => p.date >= camp.start) || C.some(x => x.date >= camp.start && x.result === 'ordered');
    if (!orderedThis && camp.daysLeft <= 3 && (P.length >= 2 || c.vip) && !C.some(x => x.date >= camp.start && x.reason === 'deadline'))
      out.push({ r: 'deadline', s: 76 + (3 - camp.daysLeft) * 3, why: camp.daysLeft === 0 ? `第 ${camp.no} 期今天截止，問問要不要一起訂` : `第 ${camp.no} 期 ${md(camp.deadline)} 截止，還有 ${camp.daysLeft} 天` });
    if (camp.dayIn >= 0 && camp.dayIn <= 3 && !contactedSince(camp.start))
      out.push({ r: 'catalog', s: 70 + (c.vip ? 6 : 0), why: `第 ${camp.no} 期型錄剛上架，分享給顧客看看` });
  }
  if (sinceC >= 3) {
    if (lastC && lastC.result === 'noreply' && sinceC <= 14) {
      let k = 0; for (let i = C.length - 1; i >= 0 && C[i].result === 'noreply'; i--) k++;
      if (k < 3) out.push({ r: 'noreply', s: 60, why: `${sinceC} 天前的訊息還沒回覆，輕輕再問一次` });
    }
    const ls = S[S.length - 1];
    if (ls) {
      const k = diff(ls.date, t);
      if (k >= 2 && k <= 7 && !contactedSince(ls.date)) out.push({ r: 'sample', s: 74, why: `${k} 天前送了${ls.item}，問問試用感受`, item: ls.item });
    }
    if (P.length === 1) {
      const k = diff(P[0].date, t);
      if (k >= 3 && k <= 14 && !contactedSince(P[0].date))
        out.push({ r: 'newbie', s: 72, why: `${k} 天前第一次買${pLabel(P[0])}，問問使用感受`, p: pLabel(P[0]), cat: P[0].cat });
    }
    // 每個品類看最近一次購買，挑最接近用完的那一樣
    const latest = {};
    P.forEach(p => { latest[p.cat || 'other'] = p; });
    let best = null;
    Object.values(latest).forEach(p => {
      if (!(p.cycle > 0)) return;
      const due = addDays(p.date, p.cycle), dd = diff(t, due);
      if (dd <= 7 && dd >= -21 && !contactedSince(addDays(due, -10)) && (!best || Math.abs(dd) < Math.abs(best.dd))) best = { p, dd };
    });
    if (best) {
      const n = pLabel(best.p), dd = best.dd;
      out.push({ r: 'refill', s: 84 - Math.abs(dd), why: dd > 0 ? `${n}大約 ${dd} 天後用完` : dd === 0 ? `${n}差不多今天用完` : `${n}應該已經用完 ${-dd} 天了`, p: n, cat: best.p.cat });
    }
    if (lastP) {
      const lim = Math.max((lastP.cycle || 45) * 2, 90);
      if (sinceP >= lim && sinceC >= 30) out.push({ r: 'winback', s: 55 + (c.vip ? 10 : 0), why: `已經 ${sinceP} 天沒有訂貨了`, p: pLabel(lastP), cat: lastP.cat });
    }
    const base = lastC ? lastC.date : lastP ? lastP.date : null;
    if (base && diff(base, t) >= 45 && sinceC >= 45) out.push({ r: 'dormant', s: 45 + (c.vip ? 15 : 0), why: `已經 ${diff(base, t)} 天沒有聯絡了` });
    if (fest && sinceP <= 365 && sinceC >= 7 && !C.some(x => x.reason === 'festival' && diff(x.date, t) <= 20))
      out.push({ r: 'festival', s: 48 + (c.vip ? 12 : 0), why: `${fest.n}（${md(fest.d)}）快到了，推薦送禮組合`, fest: fest.n });
  }
  if (!out.length) return null;
  out.sort((a, b) => b.s - a.s);
  return out[0];
}

function plan() {
  const t = today(), done = [], todo = [];
  for (const c of state.customers) {
    const ct = c.contacts.filter(x => x.date === t);
    if (ct.length) { done.push({ c, x: ct[ct.length - 1] }); continue; }
    const s = signal(c, t);
    if (s) todo.push({ c, ...s });
  }
  todo.sort((a, b) => b.s - a.s || (b.c.vip - a.c.vip));
  return { done, todo };
}

function buildMessage(c, f) {
  const set = (TEMPLATES[f.reason] || TEMPLATES.general)[f.tone] || TEMPLATES.general.warm;
  const camp = campaign();
  const vars = {
    c: callName(c), p: f.p, me: state.profile.me || '我', s: f.s, fest: f.fest, tip: CAT_TIP[f.cat] || '',
    no: camp ? `第 ${camp.no} 期` : '新一期', dl: camp ? md(camp.deadline) : '本期截止日', hl: camp && camp.highlight ? camp.highlight : '有不少好物',
  };
  let msg = set[f.idx % set.length].replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? '');
  if (f.tone !== 'short' && state.profile.me && !msg.includes(state.profile.me)) msg += `\n— ${state.profile.me}`;
  return msg;
}
const variants = (reason, tone) => ((TEMPLATES[reason] || TEMPLATES.general)[tone] || []).length;

const CSV_HEAD = '姓名,稱呼,手機,生日(月/日),品類,產品,購買日期,金額,幾天用完,備註,VIP';
function openImport() {
  openSheet(`
    <div class="sheet-head"><h2 id="sheetTitle">📥 匯入顧客名單</h2><button class="icon-btn" data-act="close" aria-label="關閉">✕</button></div>

      <li><div>一列一筆購買，同一位顧客買多次就寫多列。只有「姓名」一定要填。</div></li>
      <li><div>另存成 CSV，再按下面的「選擇檔案」。</div></li>
    </ol>
    <button class="btn block" data-act="csv-template">⬇️ 下載範本</button>
    <label class="btn primary block" style="margin-top:10px">📂 選擇 CSV 檔案<input type="file" id="csvFile" accept=".csv,text/csv" class="sr"></label>
    <p class="small muted">檔案只在你的手機裡讀取，不會上傳。</p>
    <div id="importResult"></div>`);
  $('#csvFile').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) { try { text = new TextDecoder('big5').decode(buf); } catch (err) { /* 不支援 big5 */ } }
    const r = importCSV(text);
    $('#importResult').innerHTML = `<div class="tip" style="margin-top:12px">✅ 新增 ${r.added} 位、更新 ${r.updated} 位顧客，共 ${r.rows} 筆資料${r.skipped ? `；${r.skipped} 列沒有姓名已略過` : ''}。</div>`;
    render();
  });
}
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function normDate(s) {
  s = (s || '').trim(); if (!s) return '';
  const m = s.match(/^(\d{2,4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if (!m) return '';
  let y = +m[1]; if (y < 1000) y += 1911; // 民國年
  return `${y}-${pad(m[2])}-${pad(m[3])}`;
}
function normBirthday(s) {
  s = (s || '').trim(); if (!s) return '';
  const parts = s.split(/[\/\-.月日]/).filter(Boolean).map(Number);
  if (parts.length < 2) return '';
  const [m, d] = parts.slice(-2);
  return m >= 1 && m <= 12 && d >= 1 && d <= 31 ? `${pad(m)}-${pad(d)}` : '';
}
function importCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) return { added: 0, updated: 0, rows: 0, skipped: 0 };
  const head = rows[0].map(h => h.trim());
  const find = (...keys) => head.findIndex(h => keys.some(k => h.includes(k)));
  const ix = { name: find('姓名', '名字', 'name'), nick: find('稱呼'), phone: find('手機', '電話', 'phone'), bd: find('生日'), cat: find('品類', '類別'), product: find('產品', '商品'), date: find('日期'), amount: find('金額'), cycle: find('天', '週期'), note: find('備註'), vip: find('VIP', 'vip') };
  const get = (r, k) => (ix[k] >= 0 ? (r[ix[k]] || '').trim() : '');
  let added = 0, updated = 0, skipped = 0;
  const touched = new Set();
  for (const r of rows.slice(1)) {
    const name = get(r, 'name'); if (!name) { skipped++; continue; }
    const phone = get(r, 'phone');
    let c = state.customers.find(x => x.name === name && (!phone || !x.phone || x.phone.replace(/\D/g, '') === phone.replace(/\D/g, '')));
    if (!c) { c = { id: uid(), name, nick: '', phone: '', birthday: '', note: '', vip: false, followUp: '', purchases: [], contacts: [], samples: [] }; state.customers.push(c); added++; touched.add(c.id); }
    else if (!touched.has(c.id)) { updated++; touched.add(c.id); }
    if (get(r, 'nick')) c.nick = get(r, 'nick');
    if (phone) c.phone = phone;
    if (normBirthday(get(r, 'bd'))) c.birthday = normBirthday(get(r, 'bd'));
    if (get(r, 'note')) c.note = get(r, 'note');
    if (/^(v|y|是|1|vip|★)/i.test(get(r, 'vip'))) c.vip = true;
    const product = get(r, 'product'), catText = get(r, 'cat');
    if (product || catText) {
      const date = normDate(get(r, 'date')) || today();
      if (!c.purchases.some(p => p.date === date && p.product === product))
        { const cat = matchCat(catText) || guessCat(product); c.purchases.push({ id: uid(), date, cat, product, amount: +get(r, 'amount').replace(/[^\d.]/g, '') || 0, cycle: get(r, 'cycle') ? +get(r, 'cycle').replace(/\D/g, '') || 0 : catOf(cat).cycle }); }
    }
  }
  if (state.profile.practice && added) { /* 匯入真實名單時保留練習資料，讓使用者自己決定是否清除 */ }
  save();
  return { added, updated, rows: rows.length - 1, skipped };
}

let period = 7;
function streak() {
  const days = new Set(); state.customers.forEach(c => c.contacts.forEach(x => days.add(x.date)));
  let d = today(), n = 0;
  if (!days.has(d)) d = addDays(d, -1);
  while (days.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function stats(days) {
  const t = today(), start = addDays(t, -(days - 1));
  const xs = []; state.customers.forEach(c => c.contacts.forEach(x => { if (x.date >= start && x.date <= t) xs.push({ ...x, cid: c.id }); }));
  const people = new Set(xs.map(x => x.cid)).size;
  const answered = xs.filter(x => x.result === 'replied' || x.result === 'ordered').length;
  const ordered = xs.filter(x => x.result === 'ordered');
  const amount = ordered.reduce((a, x) => a + (+x.amount || 0), 0);
  const byReason = {};
  xs.forEach(x => { const r = byReason[x.reason] || (byReason[x.reason] = { n: 0, ok: 0, buy: 0 }); r.n++; if (x.result === 'replied' || x.result === 'ordered') r.ok++; if (x.result === 'ordered') r.buy++; });
  return { xs, people, answered, rate: xs.length ? Math.round(answered / xs.length * 100) : 0, orders: ordered.length, amount, byReason, start };
}
function reportText() {
  const s = stats(period);

— 由「雅芳銷售小幫手」整理`;
}

    <button class="btn line block" data-act="share-app">💚 把小幫手分享到團隊群組</button>`);
}
function openWelcome() {
  openSheet(`
    <div style="text-align:center;padding:14px 4px 4px"><img src="icons/icon-192.png" alt="AVON" width="84" height="84" style="border-radius:16px"></div>
    <h2 id="sheetTitle" style="text-align:center;margin-top:10px">嗨！我是你的雅芳銷售小幫手</h2>
    <ol class="steps-guide">
      <li><div><b>每天告訴你該關心誰</b><br><span class="muted small">生日、該回購、型錄上架、訂貨截止，我會自動幫你挑出來。</span></div></li>
      <li><div><b>幫你想好要說的話</b><br><span class="muted small">一鍵用 LINE 傳出去，不適合的用詞會先提醒你。</span></div></li>
      <li><div><b>記下結果，看見成果</b><br><span class="muted small">每週一鍵回報給領導人。</span></div></li>
    </ol>
    <label class="field"><span>你希望訊息怎麼署名？</span><input id="wName" placeholder="例如：小芳" value="${esc(state.profile.me)}"></label>
    <button class="btn primary block" style="margin-top:16px" data-act="welcome-practice">先用練習資料試試看</button>
    <button class="btn block" style="margin-top:10px" data-act="welcome-blank">直接輸入我的顧客</button>
    <p class="small muted" style="text-align:center">🔒 資料只存在你的手機，不會上傳</p>`, { locked: true });
}
function openCampaign() {
  const cur = campaign() || state.profile.campaign || { no: '', start: today(), deadline: addDays(today(), 13), cycle: 14, highlight: '', link: '' };
  openSheet(`
    <div class="sheet-head"><h2 id="sheetTitle">📖 本期型錄與訂貨截止</h2><button class="icon-btn" data-act="close" aria-label="關閉">✕</button></div>
    <p class="small muted">設定一次就好。選了「每幾天一期」，期別和截止日會自動跳到下一期。</p>
    <form id="campForm">
      <div class="field-row">
        <label class="field"><span>期別</span><input name="no" type="number" inputmode="numeric" min="1" required value="${esc(cur.no)}" placeholder="例如 22"></label>
        <label class="field"><span>每幾天一期</span><select name="cycle">${[[0, '不自動換期'], [14, '14 天'], [21, '21 天'], [28, '28 天']].map(([v, l]) => `<option value="${v}" ${+cur.cycle === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      <div class="field-row">
        <label class="field"><span>本期開始</span><input name="start" type="date" required value="${esc(cur.start)}"></label>
        <label class="field"><span>訂貨截止</span><input name="deadline" type="date" required value="${esc(cur.deadline)}"></label>
      </div>
      <label class="field"><span>本期主打（一句話，可不填）</span><input name="highlight" value="${esc(cur.highlight || '')}" placeholder="例如：保濕系列有組合優惠"></label>
      <div id="campRisk"></div>
      <label class="field"><span>電子型錄連結（可不填）</span><input name="link" type="url" inputmode="url" value="${esc(cur.link || '')}" placeholder="https://"></label>
      <button class="btn primary block" style="margin-top:18px" type="submit">儲存</button>
      ${state.profile.campaign ? '<button type="button" class="btn ghost block" style="margin-top:8px" data-act="campaign-clear">清除型錄設定</button>' : ''}
    </form>`);
  const form = $('#campForm');
  form.highlight.addEventListener('input', e => { $('#campRisk').innerHTML = riskHTML(riskCheck(e.target.value)); });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if (f.deadline < f.start) { toast('截止日要在開始日之後'); return; }
    state.profile.campaign = { no: +f.no || 1, start: f.start, deadline: f.deadline, cycle: +f.cycle || 0, highlight: f.highlight.trim(), link: f.link.trim() };
    save(); closeSheet(); render(); toast(`已設定第 ${state.profile.campaign.no} 期`);
  });
}
function catalogText() {
  const k = campaign();
  return `雅芳第 ${k.no} 期型錄來囉！${k.highlight ? `本期主打：${k.highlight}。` : ''}有喜歡的跟我說，${md(k.deadline)} 前都可以幫你訂😊${k.link ? '\n' + k.link : ''}${state.profile.me ? `\n— ${state.profile.me}` : ''}`;
}

/* ---------- 底部面板 ---------- */
let sheetLocked = false;
function openSheet(html, opt = {}) {
  sheetLocked = !!opt.locked;
  const card = $('#sheetCard');
  card.innerHTML = `<div class="grab"></div>${html}`;
  $('#sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
  card.scrollTop = 0;
}
function closeSheet() { $('#sheet').classList.remove('on'); document.body.style.overflow = ''; sheetLocked = false; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet' && !sheetLocked) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheetLocked) closeSheet(); });

/* ---------- 事件 ---------- */
function startPractice() {
  state.customers = sampleCustomers(); state.profile.practice = true; state.profile.onboarded = true;
  state.profile.campaign = practiceCampaign();
  save(); closeSheet(); showAll = false; location.hash = '#today'; render();
  toast('已載入練習顧客和第 22 期型錄，點第一位「關心」試試看');
}
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-care],[data-cust],[data-send],[data-result],[data-tone],[data-filter],[data-period],[data-later],[data-deftone],[data-daily],[data-theme-set]');
  if (!el) return;
  const d = el.dataset;
  if (d.care) { openCare(d.care, d.reason); return; }
  if (d.cust) { openCustomer(d.cust); return; }
  if (d.send) { send(d.send); return; }
  if (d.result) { pickResult(d.result); return; }
  if (d.later) { finishResult('later', { followUp: addDays(today(), +d.later) }); return; }
  if (d.tone) { flow.tone = d.tone; flow.idx = 0; flow.msg = buildMessage(byId(flow.id), flow); renderCare(); return; }
  if (d.filter) { custFilter = d.filter; renderCustomers(); return; }
  if (d.period) { period = +d.period; renderResults(); return; }
  if (d.deftone) { state.profile.tone = d.deftone; save(); renderMore(); return; }
  if (d.daily) { state.profile.daily = +d.daily; save(); render(); return; }
  if (d.themeSet) { state.profile.theme = d.themeSet; save(); render(); return; }
  switch (d.act) {
    case 'close': closeSheet(); break;
    case 'add': openCustomerForm(); break;
    case 'import': openImport(); break;
    case 'edit': openCustomerForm(d.id); break;
    case 'add-purchase': openPurchaseForm(d.id); break;
    case 'add-sample': openSampleForm(d.id); break;
    case 'back-cust': openCustomer(d.id); break;
    case 'back-care': renderCare(); break;
    case 'delete': {
      const c = byId(d.id);
      if (confirm(`確定要刪除 ${c.name} 和所有紀錄嗎？`)) { state.customers = state.customers.filter(x => x.id !== d.id); save(); closeSheet(); render(); toast('已刪除'); }
      break;
    }
    case 'show-all': showAll = !showAll; renderToday(); break;
    case 'next-variant': flow.idx++; flow.msg = buildMessage(byId(flow.id), flow); $('#msg').value = flow.msg; updateRisk(); break;
    case 'ai-help': openAIHelp(); break;
    case 'copy-prompt': toast((await copy($('#aiPrompt').value)) ? '已複製，打開 AI 貼上就可以' : '請長按指令複製'); break;
    case 'use-ai': { const v = $('#aiBack').value.trim(); if (!v) { toast('請先貼上 AI 寫好的訊息'); break; } flow.msg = v; renderCare(); toast('已放進訊息框，記得把「〇〇」換成本名'); break; }
    case 'save-order':
      finishResult('ordered', { cat: $('#oCat').value, product: $('#oProduct').value.trim(), amount: +$('#oAmount').value || 0, cycle: +$('#oCycle').value || 0 });
      break;
    case 'campaign': openCampaign(); break;
    case 'campaign-clear': if (confirm('要清除本期型錄設定嗎？')) { state.profile.campaign = null; save(); closeSheet(); render(); } break;
    case 'share-catalog': {
      const text = catalogText();
      const hits = riskCheck(text);
      if (hits.length && !confirm(`本期主打裡有「${hits.flatMap(h => h.words).join('、')}」，可能不符合規範。確定還是要分享嗎？`)) break;
      window.open('https://line.me/R/share?text=' + encodeURIComponent(text), '_blank');
      break;
    }
    case 'words': openWords(); break;
    case 'csv-template': download('雅芳顧客名單範本.csv', '﻿' + CSV_HEAD + '\r\n林美惠,美惠姐,0912-345-678,3/15,臉部保養,保濕精華液,2026/10/20,1680,60,敏感肌,V\r\n陳淑芬,,0922-111-222,,髮品,洗髮精,2026/10/05,590,45,,\r\n', 'text/csv;charset=utf-8'); break;
    case 'report-copy': toast((await copy(reportText())) ? '已複製週報' : '請長按文字複製'); break;
    case 'report-line': window.open('https://line.me/R/share?text=' + encodeURIComponent(reportText()), '_blank'); break;
    case 'install': install(); break;
    case 'hide-install': try { localStorage.setItem('spca-hide-install', today()); } catch (err) { /* 無法儲存 */ } render(); break;
    case 'reminder': download('雅芳銷售小幫手每日提醒.ics', reminderICS(), 'text/calendar;charset=utf-8'); toast('打開下載的檔案，按「加入行事曆」就完成了'); break;
    case 'share-app': {
      const url = location.origin + location.pathname;
      const text = '推薦你用「雅芳銷售小幫手」：每天告訴你該關心哪些顧客、訊息幫你寫好、一鍵 LINE 傳送。打開後按「安裝」就能放到手機桌面👇';
      if (navigator.share) { try { await navigator.share({ title: '雅芳銷售小幫手', text, url }); } catch (err) { /* 使用者取消 */ } }
      else window.open('https://line.me/R/share?text=' + encodeURIComponent(text + '\n' + url), '_blank');
      break;
    }
    case 'guide': openGuide(); break;
    case 'leader': openLeader(); break;
    case 'practice':
      if (state.customers.length && !state.profile.practice && !confirm('練習資料會取代目前的顧客資料，建議先備份。確定要載入嗎？')) break;
      startPractice(); break;
    case 'clear-practice':
      if (confirm('要清除練習資料，開始輸入自己的顧客嗎？')) { state.customers = []; state.profile.practice = false; state.profile.campaign = null; save(); render(); openCustomerForm(); }
      break;
    case 'backup': download(`雅芳銷售小幫手備份-${today()}.json`, JSON.stringify(state, null, 1), 'application/json'); toast('已下載備份檔，請存到雲端硬碟或傳給自己'); break;
    case 'wipe':
      if (confirm('確定要清除所有顧客與紀錄嗎？這個動作無法復原，建議先備份。')) { state = blank(); state.profile.onboarded = true; save(); render(); toast('已清除'); }
      break;
    case 'welcome-practice': state.profile.me = $('#wName').value.trim(); startPractice(); break;
    case 'welcome-blank': state.profile.me = $('#wName').value.trim(); state.profile.onboarded = true; save(); closeSheet(); go('customers'); openCustomerForm(); break;
  }
});
$('#helpBtn').addEventListener('click', openGuide);
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 4), { passive: true });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (tab === 'today') renderToday(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; render(); });
// 跨日時自動更新今天的名單
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

/* ---------- 啟動 ---------- */
// 舊資料補上品類與試用欄位
function migrate(s) {
  s.customers.forEach(c => {
    c.samples = c.samples || [];
    c.purchases.forEach(p => { if (!p.cat) p.cat = guessCat(p.product); });
  });
  return s;
}
state = migrate(load());
if (demo) {
  document.documentElement.classList.add('demo');
  state = blank();
  state.profile = { ...state.profile, me: '小芳', onboarded: true, practice: true, campaign: practiceCampaign() };
  state.customers = sampleCustomers();
}
route();
if (demo === 'care') { const first = plan().todo[0]; if (first) openCare(first.c.id); }
if (demo === 'results') go('results');
if (!state.profile.onboarded && !demo) openWelcome();

if ('serviceWorker' in navigator && location.protocol !== 'file:' && !demo) {
  const hadController = !!navigator.serviceWorker.controller; // 第一次安裝不算更新
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => {
        if (w.state === 'activated' && hadController) toast('小幫手有新版本了', '立即更新', () => location.reload());
      });
    });
  }).catch(() => { /* 不支援時照常使用 */ });
}
</script>
</body>
</html>
